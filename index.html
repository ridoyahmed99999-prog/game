<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Dodger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #1e293b;
    }

    canvas {
      display: block;
      background: #030712;
    }

    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(4px);
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: bold;
      color: #030712;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #e2e8f0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div id="hud">Score: <span id="scoreText">0</span></div>

    <!-- Start Screen -->
    <div id="startScreen" class="ui-overlay">
      <h1>Space Dodger</h1>
      <p>Use ⬅️ ➡️ or A / D to dodge obstacles</p>
      <button id="startBtn">Start Game</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="ui-overlay hidden">
      <h1>Game Over</h1>
      <p>Final Score: <span id="finalScoreText">0</span></p>
      <button id="restartBtn">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const scoreText = document.getElementById('scoreText');
    const finalScoreText = document.getElementById('finalScoreText');

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    let isPlaying = false;
    let score = 0;
    let animationId;
    let keys = {};

    // Player Object
    const player = {
      x: canvas.width / 2 - 15,
      y: canvas.height - 50,
      width: 30,
      height: 30,
      speed: 6,
      color: '#38bdf8'
    };

    // Obstacles Array
    let obstacles = [];
    let spawnTimer = 0;
    let spawnInterval = 40; // Spawns an obstacle every N frames

    // Key Listeners
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    function startGame() {
      isPlaying = true;
      score = 0;
      obstacles = [];
      spawnTimer = 0;
      player.x = canvas.width / 2 - player.width / 2;

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      if (animationId) cancelAnimationFrame(animationId);
      gameLoop();
    }

    function spawnObstacle() {
      const size = Math.random() * 25 + 15;
      obstacles.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: Math.random() * 3 + 3,
        color: '#f43f5e'
      });
    }

    function checkCollision(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    function gameOver() {
      isPlaying = false;
      finalScoreText.textContent = Math.floor(score);
      gameOverScreen.classList.remove('hidden');
    }

    function update() {
      // Player Movement
      if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) {
        player.x -= player.speed;
      }
      if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x + player.width < canvas.width) {
        player.x += player.speed;
      }

      // Spawn Obstacles
      spawnTimer++;
      if (spawnTimer >= spawnInterval) {
        spawnObstacle();
        spawnTimer = 0;
      }

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.speed;

        // Check collision
        if (checkCollision(player, obs)) {
          gameOver();
          return;
        }

        // Remove offscreen obstacles
        if (obs.y > canvas.height) {
          obstacles.splice(i, 1);
        }
      }

      // Increment score
      score += 0.1;
      scoreText.textContent = Math.floor(score);
    }

    function render() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Player (Ship Shape)
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // Draw Obstacles
      obstacles.forEach((obs) => {
        ctx.fillStyle = obs.color;
        ctx.beginPath();
        ctx.roundRect(obs.x, obs.y, obs.width, obs.height, 4);
        ctx.fill();
      });
    }

    function gameLoop() {
      if (!isPlaying) return;
      update();
      render();
      animationId = requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
